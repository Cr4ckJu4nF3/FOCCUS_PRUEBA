[pytest]
testpaths = tests
pythonpath = .
# Cada "pytest" mide la cobertura y falla si baja del umbral (ver .coveragerc)
addopts = --cov --cov-report=term-missing:skip-covered -ra
markers =
    unit: lógica pura, sin BD ni red (semana 2)
    api: contrato HTTP con TestClient y SQLite en memoria (semana 4)
    doubles: mocks, stubs y spies sobre dependencias externas (semana 5)
    integration: contra MySQL/MariaDB real, se salta sin TEST_DATABASE_URL (semana 6)
    tdd: historia de usuario construida con TDD (semana 10)
filterwarnings =
    ignore::DeprecationWarning
