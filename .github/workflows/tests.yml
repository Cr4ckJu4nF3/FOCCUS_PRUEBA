# Corre los tests de backend y frontend y exige el umbral de cobertura
# (regla de trinquete: ver docs/testing/cobertura.md) en cada push y pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api_usuarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/api_usuarios/requirements.txt
            backend/api_usuarios/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # pytest.ini ya incluye --cov y .coveragerc define fail_under;
      # el reporte HTML queda descargable desde la pestaña Actions
      - run: pytest --cov-report=html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/api_usuarios/htmlcov/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7

  # No construye ni testea nada: deja en el resumen del run quién hizo commits de test.
  evidencia-individual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commits de test por autor esta semana
        run: |
          echo "### Commits de test por autor desde el lunes" >> "$GITHUB_STEP_SUMMARY"
          git shortlog -sn --since="last Monday" HEAD -- '*tests/*' '*.test.*' '*.spec.*' '*e2e/*' >> "$GITHUB_STEP_SUMMARY"
