# Base de datos SOLO para pruebas (integración y E2E). No toca la de desarrollo.
#   docker compose -f docker-compose.test.yml up -d
#   export TEST_DATABASE_URL="mysql+pymysql://foccus_test:foccus_test@127.0.0.1:3307/foccus_test"
# Puerto 3307 para no chocar con el MySQL/XAMPP local (3306).
services:
  db-test:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: foccus_test
      MARIADB_USER: foccus_test
      MARIADB_PASSWORD: foccus_test
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    # tmpfs: los datos viven en memoria; cada "down" parte de cero
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20
